plugins {
  id 'java'
  id 'application'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

application {
  mainClass = 'com.yourpackage.Main' // اینجا اسم Main رو درست بزار
}

dependencies {
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
  implementation 'com.google.code.gson:gson:2.10.1'
  // بقیه dependency ها...
}
